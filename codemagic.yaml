# Codemagic CI/CD Pipeline for Need for Speed: Carbon (iOS / ARM64)
# Statically recompiled native Apple Silicon build

workflows:
  build-nfs-carbon-ios:
    name: Build NFS Carbon iOS (ARM64)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      python: 3.12
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      groups:
        - carbon_secrets  # Optional Codemagic secret group for CARBON_XEX_SECRET
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Select Xcode & Verify Toolchain
        script: |
          echo "[CI] Selecting Xcode 16 if available..."
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "${XCODE_16}" ]; then
            echo "[CI] Selecting Xcode 16 at ${XCODE_16}..."
            sudo xcode-select -s "${XCODE_16}"
          fi
          echo "[CI] Active Xcode version:"
          xcodebuild -version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find clang++

      - name: Install Python Dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install Build Tools
        script: |
          brew install cmake ninja

      - name: Setup AppIcon & Assets Catalog
        script: |
          python3 tools/generate_appicon.py

      - name: Restore or Prepare Game Codegen (PowerPC to C++)
        script: |
          mkdir -p game generated/default xex

          # Priority 1: CARBON_XEX_SECRET (URL or base64-encoded USA XEX)
          if [ -n "${CARBON_XEX_SECRET}" ]; then
            echo "[CI] Found CARBON_XEX_SECRET. Decoding usa_default.xex..."
            if [[ "${CARBON_XEX_SECRET}" =~ ^https?:// ]]; then
              curl -L -s -o xex/usa_default.xex "${CARBON_XEX_SECRET}"
            else
              echo "${CARBON_XEX_SECRET}" | base64 -d > xex/usa_default.xex
            fi
            echo "[CI] Decoded usa_default.xex: $(wc -c < xex/usa_default.xex) bytes."
          fi

          # Priority 2: xex/usa_default.xex committed to repo (private repo only)
          if [ -f "xex/usa_default.xex" ]; then
            echo "[CI] Staging xex/usa_default.xex -> game/default.xex"
            cp -f xex/usa_default.xex game/default.xex
            echo "[CI] Staged USA XEX: $(wc -c < game/default.xex) bytes"
          fi

          # Priority 3: Unpack pre-generated C++ cache (gen.tar.gz) if XEX is unavailable
          if [ ! -f "game/default.xex" ]; then
            python3 tools/generate_code.py --unpack-cache || true
          fi

      - name: Prepare ReXGlue iOS SDK
        script: |
          python3 tools/ios/prepare_sdk.py --sdk "../rexglue-sdk-ios"
          if [ -d "../rexglue-sdk-ios" ]; then
            (cd ../rexglue-sdk-ios && git tag -f v0.10.0 HEAD 2>/dev/null || true)
          fi

      - name: Generate Code if XEX Available
        script: |
          if [ -f "game/default.xex" ]; then
            echo "[CI] Running USA XEX codegen..."
            python3 tools/generate_code.py --xex game/default.xex --force-codegen
          else
            echo "[CI] Note: game/default.xex not found. Building host harness & probe only."
          fi

      - name: Verify USA Codegen (Fail-Fast)
        script: |
          REGISTER_CPP=$(ls generated/default/*register*.cpp 2>/dev/null | head -1 || true)
          if [ -z "${REGISTER_CPP}" ]; then
            echo "[CI] No register.cpp found -- codegen did not run (no XEX). Skipping USA verification."
          else
            echo "[CI] Verifying codegen was produced from USA XEX (not PAL)..."
            python3 tools/verify_usa_codegen.py
            echo "[CI] USA codegen verification PASSED."
          fi

      - name: Configure CMake for iOS (arm64 Native)
        script: |
          cd ios
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export OBJC="${CC}"
          export OBJCXX="${CXX}"
          cmake --preset ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DREX_PLATFORM_IOS=1 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_OBJC_COMPILER="${CC}" \
            -DCMAKE_OBJCXX_COMPILER="${CXX}" \
            -DCMAKE_ASM_COMPILER="${CC}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile and Package IPA
        script: |
          cd ios
          cmake --build --preset ios --target ipa -- -j 4 || {
            echo "[CI] Build failed! Re-running failed file with single-job diagnostics..."
            cmake --build --preset ios --target ipa -v -- -j 1
            exit 1
          }

      - name: Compute Checksums & Verify Artifacts
        script: |
          mkdir -p dist
          IPA_SRC="ios/build/NFS-Carbon-iOS-unsigned.ipa"
          if [ ! -f "${IPA_SRC}" ]; then
            IPA_SRC="ios/build/NFSCarbon.ipa"
          fi

          cp -f "${IPA_SRC}" dist/NFS-Carbon-iOS-unsigned.ipa
          cd dist
          shasum -a 256 NFS-Carbon-iOS-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt
    artifacts:
      - dist/NFS-Carbon-iOS-unsigned.ipa
      - dist/SHA256SUMS.txt
      - ios/build/*.ipa
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
        - $CM_BUILD_DIR/../rexglue-sdk-ios
        - $HOME/.nfsc-ios
        - $HOME/Library/Caches/pip
